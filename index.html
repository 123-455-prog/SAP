<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Guia prático de tarefas do dia-a-dia — trocar pneu, consertar torneira, cozinhar, primeiros socorros e sobrevivência." />
  <title>SAP — Site Auxilio Paterno</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main" class="skip-link">Pular para o conteúdo principal</a>

  <header class="site-header" role="banner">
    <div class="container header-inner">
      <div class="logo" onclick="goHome()" role="button" tabindex="0" aria-label="Ir para página inicial">
        <div class="mark" aria-hidden="true">S</div>
        <div>
          SAP
          <small>guia de tarefas básicas</small>
        </div>
      </div>

      <div class="search" role="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <label for="searchInput" class="sr-only" style="position:absolute;left:-9999px">Buscar tarefas</label>
        <input id="searchInput" type="text" placeholder="Procurar: trocar pneu, torneira, lâmpada..." aria-label="Buscar tarefas" />
      </div>

      <div id="authArea" aria-live="polite">
        <!-- Preenchido dinamicamente por auth.js -->
      </div>
    </div>
  </header>

  <main id="main">
    <!-- Preenchido dinamicamente por app.js -->
  </main>

  <footer role="contentinfo">
    <div class="container">
      Feito para te ajudar — A para soberviver com o basico. Sempre priorize sua segurança.
      <br>
      <a href="#" onclick="openAuth('login'); return false;">Área do usuário</a> ·
      <a href="#" onclick="openPrivacy(); return false;">Política de Privacidade (LGPD)</a>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script src="ai.js"></script>
</body>
</html>
